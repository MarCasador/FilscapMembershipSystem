<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: radial-gradient(circle at top, #0a1f44, #000000);
            overflow: hidden;
        }

        body::before {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            background: #1e90ff;
            filter: blur(120px);
            top: 15%;
            left: 25%;
            opacity: 0.4;
        }

        .login-box {
            position: relative;
            width: 300px;
            padding: 25px;
            border-radius: 18px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 25px rgba(30,144,255,0.4);
            text-align: center;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
            100% { transform: translateY(0px); }
        }

        h2 {
            color: #1e90ff;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .input-box {
            position: relative;
            margin: 10px 0;
        }

        .input-box input {
            width: 80%;
            padding: 10px 12px 10px 38px;
            margin: 10px auto;
            display: block;
            border: none;
            border-radius: 12px;
            background: rgba(255,255,255,0.08);
            color: white;
            font-size: 13px;
            transition: 0.3s;
        }

        .input-box span {
            position: absolute;
            left: 10px;
            top: 10px;
            color: #1e90ff;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 12px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #1e90ff, #0077cc);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.03);
            box-shadow: 0 0 15px #1e90ff;
        }

        .link {
            margin-top: 10px;
            font-size: 12px;
            color: white;
        }

        .link a {
            color: #1e90ff;
            text-decoration: none;
        }
    </style>
</head>

<body>
<div class="login-box">
    <h2>LOGIN</h2>
    <form action="/login" method="post">
        <div class="input-box">
            <input type="text" id="username" name="username" placeholder="Username" required>
        </div>

        <div class="input-box">
            <input type="password" id="password" name="password" placeholder="Password" required>
        </div>

        <button type="submit">Login</button>
    </form>
    <div class="link">
        No account? <a href="/register">Create one</a>
    </div>
</div>
<script>
    const params = new URLSearchParams(window.location.search);

    if (params.get("error") === "deactivated") {
        alert("Your account is deactivated.");
    }

    if (params.get("error") === "true") {
        alert("Invalid username or password.");
    }
</script>
</body>
</html>
