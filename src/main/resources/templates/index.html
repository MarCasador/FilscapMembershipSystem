<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>WELCOME TO FILSCAP MEMBERSHIP APPLICATION PORTAL</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #050b1f, #000000);
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            text-align: center;
            padding: 40px;
            border-radius: 12px;
            background: rgba(0, 70, 150, 0.15);
            box-shadow: 0 0 20px rgba(0, 140, 255, 0.2);
            width: 320px;
        }

        h1 {
            color: #4db5ff;
            margin-bottom: 5px;
        }

        p {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 20px;
        }

        a.button {
            display: block;
            margin: 10px 0;
            padding: 10px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.2s;
        }

        .login {
            background: #1e90ff;
            color: white;
        }

        .login:hover {
            background: #0f6fd1;
        }

        .register {
            border: 1px solid #1e90ff;
            color: #1e90ff;
        }

        .register:hover {
            background: #1e90ff;
            color: white;
        }

        .fb {
            margin-top: 15px;
            display: block;
            font-size: 13px;
            color: #7ec8ff;
            text-decoration: none;
        }

        .fb:hover {
            color: white;
        }
    </style>

</head>

<body>

<div class="box">

    <h1 style="font-size: 18px;">FILSCAP MEMBERSHIP APPLICATION PORTAL</h1>

    <a class="button login" href="/login">Login</a>
    <a class="button register" href="/register">Register</a>

    <!-- QR CODE SECTION -->
    <div style="margin-top:20px;">
        <p style="font-size:12px; color:#7ec8ff;">Scan to visit FILSCAP FB</p>

        <img src="/images/filscap-qr.png"
             alt="FILSCAP QR Code"
             style="
                width:150px;
                height:150px;
                border-radius:10px;
                border:2px solid #1e90ff;
                padding:5px;
                background:white;
             ">
    </div>

    <a class="fb" href="https://www.facebook.com/FILSCAP" target="_blank">
        Visit FILSCAP Facebook Page
    </a>

</div>

</body>
</html>
