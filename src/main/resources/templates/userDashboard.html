<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Dashboard</title>

    <style>
        :root{
            --primary: #0a427c;
            --dark:#000814;
        }

        body{
            margin:0;
            font-family:Arial;
            height:94vh;

            display:flex;

            /* FIXED IMAGE PATH */
            background: url("/images/filscap.png");
            background-size: cover;

            color: #eceff3;
        }


        .sidebar{
            width:220px;
            background:var(--dark);
            padding:20px;

            display:flex;
            flex-direction:column;
            height:94vh;   /* important para may space hanggang baba */
        }

        .sidebar h2{ color:var(--primary); }

        .sidebar button{
            width:100%;
            padding:10px;
            margin-bottom:10px;
            background: #042240;
            border:none;
            color: #faf8f8;
            cursor:pointer;
            border-radius:5px;
        }

        .sidebar button:hover{ background:var(--primary); }

        .main{
            flex:1;

            display:flex;

            justify-content:center;

            align-items:center;

            gap:16px;

            padding:15px;

            overflow:hidden;
        }

        /* APPLICATION FORM */
        #application{
            display:none;

            width:620px; /* mas maliit */

            height:82vh; /* mas compact */
            font-size: 20px;

            background: rgba(3, 18, 35, 0.72);

            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);

            border:1px solid rgba(255,255,255,.08);

            border-radius:18px;

            box-shadow:
                    0 8px 28px rgba(0,0,0,.5);

            padding:18px;

            overflow:hidden;
        }

        #application.active{
            display:block;
        }

        /* FORM SCROLL */
        #application form{
            height:calc(82vh - 70px);

            overflow-y:auto;

            padding-right:8px;
        }

        /* SCROLLBAR */
        #application form::-webkit-scrollbar{
            width:6px;
        }

        #application form::-webkit-scrollbar-thumb{
            background:#2a6fb5;
            border-radius:20px;
        }

        /* PREVIEW */
        .previewPanel{

            width:280px;

            height:82vh;

            background: rgba(3, 18, 35, 0.72);

            backdrop-filter: blur(30px);

            border:1px solid rgba(255,255,255,.08);

            border-radius:18px;

            padding:18px;

            box-shadow:
                    0 8px 28px rgba(0,0,0,.5);

            overflow-y:auto;
        }

        /* INPUTS */
        #application input,
        #application select,
        #application textarea{

            padding:8px;

            font-size:16x;

            margin-bottom:8px;
        }

        /* LABEL */
        #application label{
            font-size:11px;
        }

        /* BUTTON */
        #application .submitBtn{
            padding:10px;
            font-size:14px;
        }

        .section{
            display:none;

            /* DARKER GLASS EFFECT */
            background: rgba(3, 18, 35, 0.72);

            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);

            border: 1px solid rgba(255, 255, 255, 0.08);

            padding:25px;

            border-radius:20px;

            width:600px;

            box-shadow:
                    0 8px 32px rgba(0, 0, 0, 0.55),
                    inset 0 0 12px rgba(255,255,255,0.03);
        }

        .active{
            display:block;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .grid input,
        .grid select {
            width: 100%;
        }
        .grid label{
            font-size: 12px;
        }

        input, select, textarea {
            width: 100%;              /* ✔ full aligned */
            padding: 4px;
            margin: 2px 0 7px;
            background: #ffffff;
            border: 1px solid #0c0c0c;
            color: #0c0c0c;
            border-radius: 4px;
            box-sizing: border-box;   /* ✔ important for alignment */
            font-size: 14px;  /* change this value */
            font-weight: 600;    /* semi-bold */
        }

        textarea{
            min-height:25px;
        }

        button.submitBtn{
            background:var(--primary);
            border:none;
            padding:10px;
            color: #f3f1f1;
            width:100%;
            border-radius:5px;
        }
        label{
            font-size: 12px;      /* smaller text */
            display: block;
            margin-bottom: 3px;   /* space between label and input */
            color: #d6e2f0;       /* lighter para readable sa dark bg */
        }

        /* OPTIONAL: tighten form spacing */
        .section{
            line-height: 1.2;
        }
        .logoutBtn{
            margin-top: auto;   /* ito lang ang important */
        }
        #summary{
            max-height: 82vh;   /* same height as other panels */
            overflow-y: auto;   /* 🔥 enables scrolling */
            padding-right: 8px; /* para di dikit scrollbar */
        }
    </style>
</head>

<body>

<div class="sidebar">
    <h2>USER DASHBOARD</h2>
    <button onclick="showSection('application')" style="font-size:18px; padding:20px 50px;">
        APPLICATION FROM
    </button>
    <button onclick="showSection('emergency')"style="font-size:18px; padding:20px 50px;">
        EMERGENCY CONTACT</button>
    <button onclick="showSection('documentsSection')"style="font-size:18px; padding:20px 50px;">DOCUMENTS UPLOAD</button>
    <button onclick="showSection('status')"style="font-size:18px; padding:20px 50px;">MEMBERSHIP STATUS</button>
    <button onclick="showSection('summary')"style="font-size:18px; padding:20px 50px;">Summary</button>
    <button class="logoutBtn" onclick="logout()">Logout</button>
</div>

<div class="main">

    <!-- APPLICATION -->
    <div id="application" class="section active applicationLayout">
        <h2>Application Form</h2>

        <form onsubmit="handleSave(event)">

            <div class="grid">
                <div class="field">
                    <label>First Name</label>
                    <input id="first_name" required>
                </div>

                <div class="field">
                    <label>Last Name</label>
                    <input id="last_name" required>
                </div>
            </div>

            <div class="field">
                <label>Middle Name</label>
                <input id="middle_name">
            </div>

            <div class="grid">
                <div class="field">
                    <label>Birthdate</label>
                    <input type="date" id="birthdate">
                </div>

                <div class="field">
                    <label>Age</label>
                    <input id="age" readonly>
                </div>
            </div>

            <div class="field">
                <label>Birthplace</label>
                <input id="birthplace">
            </div>

            <div class="field">
                <label>Nationality</label>
                <input id="nationality">
            </div>

            <div class="field">
                <label>Company Name</label>
                <input id="CompanyName">
            </div>

            <div class="grid">
                <div class="field">
                    <label>Civil Status</label>
                    <select id="civil_status">
                        <option>Single</option>
                        <option>Married</option>
                        <option>Widowed</option>
                        <option>Separated</option>
                    </select>
                </div>

                <div class="field">
                    <label>Category</label>
                    <select id="category_id" required>
                        <option value="">Select Category</option>
                        <option value="1">Regular Member</option>
                        <option value="2">Successor</option>
                        <option value="3">Publisher</option>
                    </select>
                </div>
            </div>

            <div class="field">
                <label>Band Name</label>
                <input id="band_name">
            </div>

            <div class="grid">
                <div class="field">
                    <label>Cell Number</label>
                    <input id="cell_number">
                </div>

                <div class="field">
                    <label>Home Number</label>
                    <input id="home_number">
                </div>
            </div>

            <div class="field">
                <label>Email</label>
                <input id="email_address">
            </div>

            <div class="field">
                <label>Pseudonym</label>
                <input id="pseudonym">
            </div>

            <div class="field">
                <label>Current Address</label>
                <textarea id="current_address"></textarea>
            </div>

            <div class="field">
                <label>Permanent Address</label>
                <textarea id="permanent_address"></textarea>
            </div>

            <button class="submitBtn">Save Application</button>
        </form>
    </div>

    <!-- EMERGENCY -->
    <div id="emergency" class="section">
        <h2>Emergency Contact</h2>

        <b>Member ID:</b>
        <span id="memberIdDisplay">Not Saved</span>

        <div class="grid">
            <input id="ecName" placeholder="Name">
            <input id="ecRelation" placeholder="Relation">
            <input id="ecNumber" placeholder="Contact Number">
            <input id="ecEmail" placeholder="Email">
        </div>

        <textarea id="ecAddress" placeholder="Address"></textarea>

        <button class="submitBtn" type="button" onclick="addContact()">
            Add Contact
        </button>

        <hr>

        <table border="1" width="100%">
            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Relation</th>
                <th>Contact</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody id="contactTable"></tbody>
        </table>
    </div>
    <div id="documentsSection" class="section">

        <h2>Documents Upload</h2>

        <!-- 🔥 AJAX FORM -->
        <form id="uploadForm">

            <input type="hidden" name="memberId" id="member_id">

            <input type="file" name="file" id="fileInput" required>

            <button type="submit" class="submitBtn">
                Upload
            </button>

        </form>

        <hr>

        <h3>Uploaded Documents</h3>

        <table border="1" width="100%">
            <thead>
            <tr>
                <th>ID</th>
                <th>File Name</th>
                <th>Date</th>
                <th>Action</th>
            </tr>
            </thead>

            <tbody id="docTable"></tbody>
        </table>

    </div>
    <!-- STATUS -->
    <div id="status" class="section">

        <div id="statusInfo">
            <p>Loading status...</p>
        </div>

        <hr>

        <h3>📜 Approval Timeline</h3>
        <div id="auditLog"></div>

    </div>

    <!-- SUMMARY -->
    <div id="summary" class="section">
        <h2>Summary</h2>
        <div id="summaryContent"></div>
        <button onclick="printSummary()" class="submitBtn">
            Print Summary
        </button>
    </div>

</div>

<script>

    let savedMemberId = null;

    function getMemberId() {
        return savedMemberId || document.getElementById("member_id")?.value || null;
    }

    /* ================= NAVIGATION ================= */
    function showSection(id) {

        document.querySelectorAll('.section')
            .forEach(s => s.classList.remove('active'));

        document.getElementById(id).classList.add('active');

        if (id === "emergency") {
            loadContacts();
        }

        if (id === "summary") {
            updateSummary();
        }

        if (id === "documentsSection") {
            loadDocuments();
        }
        if (id === "status") {
            loadStatus();
        }
    }
    /* ================= AGE COMPUTATION ================= */
    function calculateAge() {

        const birthdateValue = document.getElementById("birthdate").value;

        if (!birthdateValue) {
            document.getElementById("age").value = "";
            return;
        }

        const birthDate = new Date(birthdateValue);
        const today = new Date();

        let computedAge =
            today.getFullYear() - birthDate.getFullYear();

        const monthDiff =
            today.getMonth() - birthDate.getMonth();

        if (
            monthDiff < 0 ||
            (
                monthDiff === 0 &&
                today.getDate() < birthDate.getDate()
            )
        ) {
            computedAge--;
        }

        document.getElementById("age").value = computedAge;
    }
    /* ================= LOAD MEMBER ================= */
    window.onload = function () {

        fetch("/member/current")
            .then(r => {
                if (!r.ok) {
                    throw new Error("Failed to load member");
                }
                return r.json();
            })
            .then(m => {

                console.log("CURRENT MEMBER:", m);

                if (!m || !m.id) {
                    console.warn("No member found");
                    return;
                }

                savedMemberId = m.id;

                document.getElementById("member_id").value = m.id;
                document.getElementById("memberIdDisplay").innerText = m.id;

                /* FORM VALUES */
                first_name.value = m.firstName || "";
                last_name.value = m.lastName || "";
                middle_name.value = m.middleName || "";
                birthdate.value = m.birthdate || "";

                calculateAge();
                birthplace.value = m.birthplace || "";
                nationality.value = m.nationality || "";
                CompanyName.value = m.companyName || "";
                civil_status.value = m.civilStatus || "";
                category_id.value = m.category?.id || "";
                band_name.value = m.bandName || "";
                cell_number.value = m.cellNumber || "";
                home_number.value = m.homeNumber || "";
                email_address.value = m.emailAddress || "";
                pseudonym.value = m.pseudonym || "";
                current_address.value = m.currentAddress || "";
                permanent_address.value = m.permanentAddress || "";

                loadContacts();
                loadDocuments();
            })
            .catch(err => {
                console.error("LOAD MEMBER ERROR:", err);
            });

        const params = new URLSearchParams(window.location.search);
        const tab = params.get("tab");

        if (tab) {
            showSection(tab);
        }
    };

    /* ================= SAVE MEMBER ================= */
    function handleSave(e) {

        e.preventDefault();

        const data = new URLSearchParams();

        data.append("firstName", first_name.value);
        data.append("lastName", last_name.value);
        data.append("middleName", middle_name.value);
        data.append("birthdate", birthdate.value);
        data.append("age", age.value);
        data.append("birthplace", birthplace.value);
        data.append("nationality", nationality.value);
        data.append("companyName", CompanyName.value);
        data.append("categoryId", category_id.value);
        data.append("civilStatus", civil_status.value);
        data.append("bandName", band_name.value);
        data.append("cellNumber", cell_number.value);
        data.append("homeNumber", home_number.value);
        data.append("emailAddress", email_address.value);
        data.append("pseudonym", pseudonym.value);
        data.append("currentAddress", current_address.value);
        data.append("permanentAddress", permanent_address.value);

        fetch("/member/save", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body: data.toString()
        })
            .then(r => r.text())
            .then(id => {

                savedMemberId = Number(id);

                document.getElementById("member_id").value = savedMemberId;
                document.getElementById("memberIdDisplay").innerText = savedMemberId;

                console.log("SAVED MEMBER ID:", savedMemberId);

                alert("Application Saved!");

                loadContacts();
                loadDocuments();
            })
            .catch(err => {
                console.error("SAVE ERROR:", err);
            });
    }

    /* ================= ADD CONTACT ================= */
    function addContact() {

        if (!savedMemberId) {
            alert("Save member first!");
            return;
        }

        const contact = {
            memberId: savedMemberId,
            name: document.getElementById("ecName").value,
            relation: document.getElementById("ecRelation").value,
            emergencyContactNo: document.getElementById("ecNumber").value,
            emergencyEmailAddress: document.getElementById("ecEmail").value,
            emergencyAddress: document.getElementById("ecAddress").value
        };

        console.log("SENDING CONTACT:", contact);

        fetch("/api/emergency-contact/save", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(contact)
        })
            .then(async r => {

                const text = await r.text();

                console.log("SAVE CONTACT RESPONSE:", text);

                if (!r.ok) {
                    throw new Error(text);
                }

                return text;
            })
            .then(() => {

                document.getElementById("ecName").value = "";
                document.getElementById("ecRelation").value = "";
                document.getElementById("ecNumber").value = "";
                document.getElementById("ecEmail").value = "";
                document.getElementById("ecAddress").value = "";

                loadContacts();
                updateSummary();
            })
            .catch(err => {
                console.error("ADD CONTACT ERROR:", err);
                alert(err.message);
            });
    }

    /* ================= LOAD CONTACTS ================= */
    function loadContacts() {

        const table = document.getElementById("contactTable");

        if (!table) {
            console.error("contactTable not found in DOM");
            return;
        }

        if (!savedMemberId) {
            table.innerHTML = `<tr><td colspan="5">No Member Loaded</td></tr>`;
            return;
        }

        console.log("Loading contacts for member:", savedMemberId);

        fetch("/api/emergency-contact/member/" + savedMemberId)
            .then(async r => {

                if (!r.ok) {
                    const text = await r.text();
                    throw new Error(text);
                }

                return r.json();
            })
            .then(data => {

                console.log("CONTACT RESPONSE:", data);

                if (!Array.isArray(data)) {
                    table.innerHTML = `<tr><td colspan="5">Invalid response</td></tr>`;
                    return;
                }

                if (data.length === 0) {
                    table.innerHTML = `<tr><td colspan="5">No contacts found</td></tr>`;
                    return;
                }

                table.innerHTML = data.map(c => `
                <tr>
                    <td>${c.id ?? ""}</td>
                    <td>${c.name ?? ""}</td>
                    <td>${c.relation ?? ""}</td>
                    <td>${c.emergencyContactNo ?? ""}</td>
                    <td>
                        <button onclick="deleteContact(${c.id})">Delete</button>
                    </td>
                </tr>
            `).join("");

            })
            .catch(err => {
                console.error("LOAD CONTACT ERROR:", err);
                table.innerHTML = `<tr><td colspan="5">Error loading contacts</td></tr>`;
            });
    }
    /* ================= DELETE CONTACT ================= */
    function deleteContact(id) {

        fetch("/api/emergency-contact/" + id, {
            method: "DELETE"
        })
            .then(() => {
                loadContacts();
            })
            .catch(err => {
                console.error("DELETE CONTACT ERROR:", err);
            });
    }

    /* ================= UPDATE SUMMARY ================= */
    function updateSummary() {

        const memberId = getMemberId();

        if (!memberId) {
            summaryContent.innerHTML = "<p>No member selected</p>";
            return;
        }

        Promise.all([
            fetch("/api/emergency-contact/member/" + memberId).then(r => r.json()),
            fetch("/api/documents/member/" + memberId).then(r => r.json()),
            fetch("/member/current").then(r => r.json())
        ])
            .then(([contacts, docs, member]) => {

                let html = "";

                /* ================= MEMBER INFO ================= */
                html += `
            <h3>👤 Member Information</h3>
            <p><b>Full Name:</b> ${member.firstName || ""} ${member.middleName || ""} ${member.lastName || ""}</p>
            <p><b>Birthdate:</b> ${member.birthdate || ""}</p>
            <p><b>Age:</b> ${member.age || ""}</p>
            <p><b>Birthplace:</b> ${member.birthplace || ""}</p>
            <p><b>Nationality:</b> ${member.nationality || ""}</p>
            <p><b>Company:</b> ${member.companyName || ""}</p>
            <p><b>Civil Status:</b> ${member.civilStatus || ""}</p>
            <p><b>Category:</b> ${member.category?.name || ""}</p>
            <p><b>Band Name:</b> ${member.bandName || ""}</p>
            <p><b>Email:</b> ${member.emailAddress || ""}</p>
            <p><b>Cell:</b> ${member.cellNumber || ""}</p>
            <p><b>Home:</b> ${member.homeNumber || ""}</p>
            <p><b>Pseudonym:</b> ${member.pseudonym || ""}</p>
            <p><b>Current Address:</b> ${member.currentAddress || ""}</p>
            <p><b>Permanent Address:</b> ${member.permanentAddress || ""}</p>

            <hr>
        `;

                /* ================= CONTACTS ================= */
                html += `<h3>📞 Emergency Contacts</h3>`;

                if (!contacts || contacts.length === 0) {
                    html += `<p>No contacts found</p>`;
                } else {
                    contacts.forEach(c => {
                        html += `
                    <p>
                        <b>${c.name || ""}</b><br>
                        Relation: ${c.relation || ""}<br>
                        Contact: ${c.emergencyContactNo || ""}<br>
                        Email: ${c.emergencyEmailAddress || ""}<br>
                        Address: ${c.emergencyAddress || ""}
                    </p>
                    <hr>
                `;
                    });
                }

                /* ================= DOCUMENTS ================= */
                html += `<h3>📁 Documents</h3>`;

                if (!docs || docs.length === 0) {
                    html += `<p>No documents uploaded</p>`;
                } else {
                    docs.forEach(d => {
                        html += `
                    <p>
                        📄 ${d.fileName || ""}<br>
                        <small>Uploaded: ${d.uploadDate || ""}</small>
                    </p>
                `;
                    });
                }

                summaryContent.innerHTML = html;
            })
            .catch(err => {
                console.error("SUMMARY ERROR:", err);
                summaryContent.innerHTML = "<p style='color:red'>Failed to load summary</p>";
            });
    }

    /* ================= LOGOUT ================= */
    function logout() {
        window.location.href = "/logout";
    }

    /* ================= LOAD DOCUMENTS ================= */
    function loadDocuments() {

        fetch("/api/documents/member/" + savedMemberId)
            .then(r => r.json())
            .then(data => {

                let rows = "";

                if (!data || data.length === 0) {
                    rows = `<tr><td colspan="4">No documents</td></tr>`;
                } else {
                    data.forEach(d => {
                        rows += `
                        <tr>
                            <td>${d.id}</td>
                            <td>${d.fileName}</td>
                            <td>${d.uploadDate || ""}</td>
                            <td>
                                <button onclick="deleteDocument(${d.id})">
                                    Delete
                                </button>
                            </td>
                        </tr>
                    `;
                    });
                }

                document.getElementById("docTable").innerHTML = rows;
            });
    }

    /* ================= DELETE DOCUMENT ================= */
    function deleteDocument(id) {

        fetch("/api/documents/" + id, {
            method: "DELETE"
        })
            .then(async r => {

                if (!r.ok) {
                    throw new Error(await r.text());
                }

                loadDocuments();
            })
            .catch(err => {
                console.error("DELETE ERROR:", err);
            });
    }

    /* ================= UPLOAD DOCUMENT ================= */
    document.getElementById("uploadForm")
        .addEventListener("submit", function (e) {

            e.preventDefault();

            if (!savedMemberId) {
                alert("No member selected");
                return;
            }

            const fileInput = document.getElementById("fileInput");

            if (!fileInput.files[0]) {
                alert("Select a file");
                return;
            }

            let formData = new FormData();

            formData.append("file", fileInput.files[0]);
            formData.append("memberId", savedMemberId);

            fetch("/api/documents/upload", {   // 🔥 FIXED
                method: "POST",
                body: formData
            })
                .then(async (res) => {

                    if (!res.ok) {
                        const err = await res.text();
                        throw new Error(err);
                    }

                    return res.json();
                })
                .then(data => {
                    console.log("UPLOAD SUCCESS:", data);

                    fileInput.value = "";

                    loadDocuments(); // refresh table
                })
                .catch(err => {
                    console.error("UPLOAD ERROR:", err);
                    alert(err.message);
                });
        });

    /* ================= PRINT ================= */
    function printSummary() {

        let content = document.getElementById("summaryContent").innerHTML;

        let printWindow = window.open("", "", "width=900,height=650");

        printWindow.document.write(`
            <html>
            <head>
                <title>Print Summary</title>

                <style>
                    body{
                        font-family:Arial;
                        padding:20px;
                        color:#000;
                    }

                    h3{
                        border-bottom:1px solid #ccc;
                        padding-bottom:5px;
                    }

                    p{
                        font-size:18px;
                        margin:5px 0;
                    }
                </style>

            </head>

            <body>
                ${content}
            </body>
            </html>
        `);

        printWindow.document.close();
        printWindow.focus();
        printWindow.print();
        printWindow.close();
    }
    function loadStatus() {

        let memberId = getMemberId();

        if (!memberId) return;

        // STATUS + LOGS PARALLEL
        Promise.all([
            fetch("/api/members/" + memberId).then(r => r.json()),
            fetch("/api/members/" + memberId + "/logs").then(r => r.json())
        ])
            .then(([member, logs]) => {

                /* ================= STATUS ================= */
                let status = member.status || "Pending";

                let color = "orange";
                if (status === "Approved") color = "lime";
                else if (status === "Rejected") color = "red";

                document.getElementById("statusInfo").innerHTML = `
            <h3>
                Status:
                <span style="color:${color}">
                    ${status}
                </span>
            </h3>
        `;

                /* ================= TIMELINE ================= */
                let html = "";

                if (!logs || logs.length === 0) {
                    html = "<p>No approval history yet</p>";
                } else {
                    logs.forEach(l => {

                        let icon = "🟡";
                        if (l.action === "APPROVED") icon = "🟢";
                        if (l.action === "REJECTED") icon = "🔴";

                        html += `
                    <div style="
                        padding:10px;
                        margin-bottom:10px;
                        border-left:3px solid #2a6fb5;
                        background:rgba(0,0,0,0.2);
                        border-radius:6px;
                    ">
                        <b>${icon} ${l.action}</b><br>

                        <small>
                            by ${l.adminRole} • ${l.adminEmail}
                        </small><br>

                        <small style="opacity:0.7">
                            ${l.createdAt}
                        </small>
                    </div>
                `;
                    });
                }

                document.getElementById("auditLog").innerHTML = html;
            })
            .catch(err => {
                console.error(err);
                document.getElementById("statusInfo").innerHTML =
                    "<p style='color:red'>Failed to load status</p>";
            });
    }
    /* ================= AUTO COMPUTE AGE ================= */
    document.getElementById("birthdate").addEventListener("change", function () {

        const birthDate = new Date(this.value);

        if (!this.value) {
            document.getElementById("age").value = "";
            return;
        }

        const today = new Date();

        let age = today.getFullYear() - birthDate.getFullYear();

        const monthDiff = today.getMonth() - birthDate.getMonth();

        if (
            monthDiff < 0 ||
            (monthDiff === 0 && today.getDate() < birthDate.getDate())
        ) {
            age--;
        }

        document.getElementById("age").value = age;
    });

</script>
